<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding: var(--s-12) var(--s-16) var(--s-8); display: flex; align-items: center; gap: var(--s-10); flex: 0 0 auto; color: var(--ink)">
  <sc-if value="{{ isText }}" hint-placeholder-val="{{ true }}">
    <div style="flex: 1; min-height: var(--h-48); border-radius: var(--r-22); background: var(--surf2); border: var(--bw-1) solid var(--line); display: flex; align-items: center; padding-inline: var(--s-18); font-size: var(--fs-16); color: var(--muted)"><span data-l="en">Message</span><span data-l="ar">كتابة رسالة</span></div>
  </sc-if>
  <sc-if value="{{ isRec }}">
    <div style="flex: 1; min-height: var(--h-48); border-radius: var(--r-22); background: var(--surf); border: var(--bw-1) solid var(--line); display: flex; align-items: center; gap: var(--s-10); padding-inline: var(--s-14)">
      <span style="font-size: var(--fs-13); font-weight: var(--fw-700); color: var(--ink)"><span data-l="en">0:07</span><span data-l="ar">٠:٠٧</span></span>
      <div style="flex: 1; display: flex; align-items: center; gap: var(--s-3); height: 22px; overflow: hidden">
        <div style="width: 3px; height: 8px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 16px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 11px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 20px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 13px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 18px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 9px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 15px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 21px; border-radius: var(--r-2); background: var(--ink)"></div><div style="width: 3px; height: 12px; border-radius: var(--r-2); background: var(--decor)"></div><div style="width: 3px; height: 7px; border-radius: var(--r-2); background: var(--decor)"></div>
      </div>
      <span style="font-size: var(--fs-13); font-weight: var(--fw-600); color: var(--muted)"><span data-l="en">Cancel</span><span data-l="ar">إلغاء</span></span>
    </div>
  </sc-if>
  <div style="width: var(--i-48); height: var(--i-48); flex: 0 0 var(--i-48); border-radius: var(--r-round); background: var(--btn); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 24 24" style="width: var(--i-22); height: var(--i-22); color: var(--onbtn)"><use href="{{ icon }}"></use></svg></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:68},&quot;mode&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;text&quot;,&quot;recording&quot;],&quot;default&quot;:&quot;text&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const m = this.props.mode ?? 'text';
    return { isText: m !== 'recording', isRec: m === 'recording', icon: m === 'recording' ? '#i-send' : '#i-mic' };
  }
}
</script>
</body>
</html>
