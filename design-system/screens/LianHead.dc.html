<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display: flex; align-items: center; gap: var(--s-12); padding: var(--s-4) var(--s-16) var(--s-12); flex: 0 0 auto; color: var(--ink)">
  <div style="width: var(--i-44); height: var(--i-44); display: flex; align-items: center; justify-content: center; flex: 0 0 var(--i-44)"><svg viewBox="0 0 24 24" style="width: var(--i-24); height: var(--i-24)"><use href="#i-menu"></use></svg></div>
  <div style="width: var(--i-40); height: var(--i-40); flex: 0 0 var(--i-40); border-radius: var(--r-round); background: var(--surf); display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 99.22 128" style="width: 17px; height: 21.9px"><use href="#i-mark"></use></svg></div>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column">
    <div style="font-size: var(--fs-18); line-height: var(--lh-24); font-weight: var(--fw-700)"><span data-l="en">{{ name }}</span><span data-l="ar">{{ nameAr }}</span></div>
    <div style="font-size: var(--fs-13); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis"><span data-l="en">{{ mood }}</span><span data-l="ar">{{ moodAr }}</span></div>
  </div>
  <div style="width: var(--i-44); height: var(--i-44); display: flex; align-items: center; justify-content: center; flex: 0 0 var(--i-44)"><svg viewBox="0 0 24 24" style="width: var(--i-22); height: var(--i-22); color: var(--muted)"><use href="#i-more"></use></svg></div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:60},&quot;who&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Lian&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;whoAr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;لين&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;mood&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Feeling warm today&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;moodAr&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;اليوم فيه دفء&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    return {
      name: this.props.who ?? 'Lian',
      nameAr: this.props.whoAr ?? 'لين',
      mood: this.props.mood ?? 'Feeling warm today',
      moodAr: this.props.moodAr ?? 'اليوم فيه دفء'
    };
  }
}
</script>
</body>
</html>
