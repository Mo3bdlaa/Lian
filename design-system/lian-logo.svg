<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 571.37 216" width="571.37" height="216" role="img" aria-labelledby="lian-logo-title">
  <title id="lian-logo-title">lian</title>
  <desc>Lian lockup: the two-leaf mark with the wordmark set in Nunito Bold, converted to outlines, and one bespoke modification — the l tail is compressed to 0.64 of Nunito's length (0.115 of the ascender) to match the locked reference. Letters are placed by measured ink gaps 61/81/101 per 1000 em. Placement fitted to the reference by maximising overlap: wordmark ascender = 0.726 x mark height, gap = 0.345 x mark height, ink optically centred. Fill comes from --lian-brand-ink; the hex is only the standalone fallback.</desc>
