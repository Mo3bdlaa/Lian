# Lian in production: three containers and no database.
#
# THE DATABASE IS NOT HERE, and that is the decision. It is Neon, because it
# holds other people's memories and money and its durability should not depend
# on one free VM that Oracle can reclaim. `docker-compose.yml` (the local one)
# runs Postgres in a container because there the data is disposable.
#
# Caddy rather than nginx: it obtains and renews a TLS certificate by itself
# from one line of configuration, and TLS that expires quietly eleven weeks
# after a deploy is the failure this avoids.
services:
  server:
    image: lian:latest
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
    expose: ['8787']
    # Docker's own healthcheck comes from the image (liveness). This one is
    # the ORCHESTRATOR's view and uses readiness, so a server that is up but
    # cannot reach the database is not sent traffic by Caddy.
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:8787/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 30s
    logging:
      # A free box has 50 GB of boot volume and logs are the thing that fills
      # it. Bounded, so a chatty week cannot take the product down.
      driver: json-file
      options: { max-size: '10m', max-file: '5' }

  ticker:
    image: lian:latest
    restart: unless-stopped
    env_file: .env
    command: ['node', 'apps/server/src/ticker.ts']
    environment:
      # Talks to the server over the compose network, not through Caddy: a
      # tick that depends on public DNS and TLS fails for reasons that have
      # nothing to do with the schedule.
      LIAN_PUBLIC_URL: http://server:8787
      LIAN_TICK_INTERVAL_SECONDS: '300'
    depends_on:
      server: { condition: service_healthy }
    logging:
      driver: json-file
      options: { max-size: '10m', max-file: '3' }

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ['80:80', '443:443']
    environment:
      LIAN_DOMAIN: ${LIAN_DOMAIN:?set LIAN_DOMAIN in .env — Caddy needs the name to get a certificate for}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates SURVIVE a redeploy. Without this volume every `up`
      # requests a new one, and Let's Encrypt rate-limits five per week per
      # domain — which is a limit you meet on the day you are iterating.
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      server: { condition: service_healthy }

volumes:
  caddy-data:
  caddy-config:
